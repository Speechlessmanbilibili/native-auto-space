<!doctype html>
<html lang="zh-CN" data-volume="03">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>中西文自动间距</title>
  <link rel="icon" href="icons/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="kit/kit.css">
  <link rel="stylesheet" href="ui.css">
</head>
<body class="popup" data-view="popup">
  <main class="popup-shell">
    <header class="popup-head">
      <div class="popup-brand">
        <img src="icons/source.svg" width="26" height="26" alt="">
        <strong>中西文自动间距</strong>
      </div>
    </header>

    <section class="popup-site" aria-labelledby="site-heading">
      <p class="popup-label" id="site-heading">当前网站</p>
      <p id="host" class="popup-host">正在读取……</p>
      <fieldset id="site-mode" class="segmented popup-mode">
        <legend class="sr-only">本站自动间距</legend>
        <label><input type="radio" name="site-mode" value="inherit"><span>跟随全局</span></label>
        <label><input type="radio" name="site-mode" value="on"><span>开启</span></label>
        <label><input type="radio" name="site-mode" value="off"><span>关闭</span></label>
      </fieldset>
      <p id="effective" class="popup-effective">正在读取当前网站设置……</p>
    </section>

    <div class="popup-global">
      <div>
        <p class="popup-global-title">全局默认</p>
        <p class="field-hint" id="global-state">读取中</p>
      </div>
      <label class="switch">
        <input id="enabled" class="switch-input" type="checkbox" role="switch" aria-label="全局自动间距">
        <span class="track" aria-hidden="true"></span>
      </label>
    </div>

    <p id="status" class="popup-status" role="status" aria-live="polite"></p>
    <p id="unsupported" class="notice is-danger" hidden>当前浏览器尚不支持 <code>text-autospace</code>，请更新浏览器。</p>

    <button id="open-options" class="btn" type="button">管理所有网站
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 12 12 4M4 4h8v8"/></svg>
    </button>
  </main>
  <script src="shared.js"></script>
  <script src="kit/kit.js"></script>
  <script src="ui.js"></script>
</body>
</html>
